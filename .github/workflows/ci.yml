name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Pull requests from forks run with a read-only token and no secrets.
permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Packaging manifests are in sync
        run: uv run python scripts/sync_packaging.py --check

      - name: Unit tests
        run: uv run pytest tests/unit -v

      - name: Contract tests
        run: uv run pytest tests/contract -v

      - name: Integration tests
        run: uv run pytest tests/integration -v

  package:
    name: Install from the wheel, without the lockfile
    runs-on: ubuntu-latest

    # The test suite runs against uv.lock, which pins every dependency. Users
    # installing from PyPI get a fresh resolution instead, so a dependency range
    # that is too loose is invisible to every other job here. That is not
    # hypothetical: an unbounded `mcp` requirement resolved to 2.x, which
    # removed mcp.server.fastmcp, and the published package would have failed at
    # import for everyone while CI stayed green.
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build the distribution
        run: uv build

      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/pkg-check
          uv pip install --python /tmp/pkg-check/bin/python dist/*.whl

      - name: Start the server as an installed package
        env:
          YNAB_API_KEY: fake-token-for-startup
        run: /tmp/pkg-check/bin/mcp-server-for-ynab smoke

      - name: Confirm the console script is on PATH via uvx
        env:
          YNAB_API_KEY: fake-token-for-startup
        run: uvx --from dist/*.whl mcp-server-for-ynab smoke

  bundle:
    name: Build the install surfaces
    runs-on: ubuntu-latest

    # The plugin manifest, the MCPB bundle, and the container are how most
    # people will actually install this, and none of them are exercised by the
    # test suite. A manifest that fails schema validation or an image whose
    # entrypoint cannot start is invisible until someone tries to install it.
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build and validate the MCPB bundle
        run: uv run python scripts/build_mcpb.py

      - name: Validate server.json against the MCP Registry schema
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate server.json

      - name: Build the container image
        run: docker build -t mcp-server-for-ynab .

      - name: Start the server inside the container
        run: docker run -i --rm -e YNAB_API_KEY=fake-token-for-startup mcp-server-for-ynab smoke
