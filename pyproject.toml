[project]
name = "ynab-mcp"
version = "0.1.0"
description = "AI-first MCP server for YNAB budget management"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.27.1",
    "pydantic>=2.13.4",
]

[project.scripts]
ynab-mcp = "ynab_mcp.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ynab_mcp"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.36.2",
    "pyyaml>=6.0.3",
    "ruff>=0.15.13",
    "uvicorn>=0.34.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "RUF",
]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["ynab_mcp"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ---------------------------------------------------------------------------
# Postman collection commands
# Run with: uv run python scripts/<script>.py
#
# Generate:
#   generate:postman:operator   — regenerate operator collection from routes.yaml
#   generate:postman:qa         — regenerate QA collection from feature+case files
#
# Drift check (CI):
#   check:postman:operator      — fail if operator collection is out of date
#   check:postman:qa            — fail if QA collection is out of date
#
# Run with Newman (requires: npm install -g newman):
#   test:postman:operator       — smoke-check the operator collection (read-only)
#   test:postman:qa             — run all QA cases with Newman
#   test:postman:qa:smoke       — run only @smoke-tagged QA cases
# ---------------------------------------------------------------------------
